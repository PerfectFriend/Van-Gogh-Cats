<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Van Gogh Night Sky Swirls -->
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="goldBrush" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="brushGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)"/>

  <!-- Van Gogh Swirling Brushstroke Curves -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer Star Swirls -->
    <path d="M 60 160 C 130 90, 260 100, 310 170 C 350 220, 310 300, 240 290 C 180 280, 160 210, 220 180 C 260 160, 290 190, 280 220" 
          stroke="#38bdf8" stroke-width="14" stroke-dasharray="18 10" opacity="0.65"/>
    <path d="M 80 180 C 140 120, 250 120, 290 180 C 320 220, 290 280, 230 270 C 190 260, 180 210, 220 190" 
          stroke="#facc15" stroke-width="12" stroke-dasharray="16 8" opacity="0.85"/>
    <path d="M 120 120 C 180 60, 340 70, 420 150 C 470 200, 470 290, 410 350" 
          stroke="#fbbf24" stroke-width="16" stroke-dasharray="20 12" opacity="0.5"/>
    <path d="M 40 320 C 100 270, 220 280, 280 340" 
          stroke="#60a5fa" stroke-width="14" stroke-dasharray="16 10" opacity="0.4"/>
  </g>

  <!-- Glowing Van Gogh Moon -->
  <circle cx="410" cy="110" r="60" fill="url(#moonGlow)" opacity="0.9"/>
  <circle cx="410" cy="110" r="34" fill="#fef08a" filter="url(#brushGlow)"/>
  <path d="M 395 85 C 430 90, 440 125, 425 140 C 400 135, 390 105, 395 85 Z" fill="#fef9c3"/>

  <!-- Swirling Little Stars -->
  <g fill="#fef08a">
    <circle cx="110" cy="120" r="9"/>
    <circle cx="230" cy="80" r="7"/>
    <circle cx="160" cy="240" r="8"/>
    <circle cx="460" cy="220" r="10"/>
  </g>

  <!-- Golden Palette on Bottom -->
  <ellipse cx="256" cy="450" rx="190" ry="50" fill="#78350f" stroke="#b45309" stroke-width="6" opacity="0.8"/>

  <!-- The Cat Silhouette with Impasto Brush Texture -->
  <g transform="translate(126, 170)">
    <!-- Cat Body -->
    <path d="M 130 90 
             C 180 90, 220 140, 220 210 
             C 220 265, 185 275, 130 275 
             C 75 275, 40 265, 40 210 
             C 40 140, 80 90, 130 90 Z" 
          fill="url(#catGrad)" stroke="#f59e0b" stroke-width="8"/>

    <!-- Left Ear -->
    <path d="M 68 110 L 40 40 L 98 75 Z" fill="url(#catGrad)" stroke="#f59e0b" stroke-width="6"/>
    <path d="M 66 98 L 52 56 L 90 76 Z" fill="#fcd34d" opacity="0.6"/>

    <!-- Right Ear -->
    <path d="M 192 110 L 220 40 L 162 75 Z" fill="url(#catGrad)" stroke="#f59e0b" stroke-width="6"/>
    <path d="M 194 98 L 208 56 L 170 76 Z" fill="#fcd34d" opacity="0.6"/>

    <!-- Cat Head Contour -->
    <ellipse cx="130" cy="120" rx="72" ry="60" fill="url(#catGrad)" stroke="#fbbf24" stroke-width="6"/>

    <!-- Eyes (Glowing Yellow/Green with expression) -->
    <ellipse cx="102" cy="115" rx="14" ry="18" fill="#facc15"/>
    <ellipse cx="158" cy="115" rx="14" ry="18" fill="#facc15"/>
    <ellipse cx="104" cy="115" rx="5" ry="14" fill="#0f172a"/>
    <ellipse cx="156" cy="115" rx="5" ry="14" fill="#0f172a"/>
    <!-- Eye Sparkles -->
    <circle cx="100" cy="108" r="3.5" fill="#ffffff"/>
    <circle cx="154" cy="108" r="3.5" fill="#ffffff"/>

    <!-- Cute Nose & Mouth -->
    <polygon points="130,132 124,124 136,124" fill="#f43f5e"/>
    <path d="M 124 134 C 120 142, 112 144, 108 142 M 136 134 C 140 142, 148 144, 152 142" 
          stroke="#451a03" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="90" y1="130" x2="35" y2="120"/>
      <line x1="88" y1="136" x2="30" y2="138"/>
      <line x1="92" y1="142" x2="40" y2="152"/>
      <line x1="170" y1="130" x2="225" y2="120"/>
      <line x1="172" y1="136" x2="230" y2="138"/>
      <line x1="168" y1="142" x2="220" y2="152"/>
    </g>

    <!-- Artist Straw Hat tilted -->
    <ellipse cx="130" cy="62" rx="68" ry="18" fill="#d97706" stroke="#fbbf24" stroke-width="5" transform="rotate(-6 130 62)"/>
    <ellipse cx="128" cy="48" rx="38" ry="20" fill="#f59e0b" stroke="#fcd34d" stroke-width="4" transform="rotate(-6 128 48)"/>
    <path d="M 94 56 C 110 50, 145 48, 160 54" stroke="#dc2626" stroke-width="6" fill="none" transform="rotate(-6 130 56)"/>
  </g>

  <!-- Painter's Brush held by Cat Paw -->
  <g transform="translate(190, 360) rotate(-25)">
    <!-- Wooden Handle -->
    <polygon points="10,0 200,-15 198,-5 10,8" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <!-- Metal Ferrule -->
    <rect x="-10" y="-3" width="22" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <!-- Bristles with Van Gogh Yellow Paint -->
    <path d="M -10 -3 C -30 -6, -40 2, -45 3 C -40 6, -30 10, -10 9 Z" fill="#facc15"/>
    <path d="M -30 0 C -45 -2, -52 3, -55 3 C -50 5, -42 6, -30 6 Z" fill="#38bdf8"/>
  </g>
</svg>
